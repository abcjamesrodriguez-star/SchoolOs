<!DOCTYPE html>
<html lang="es">
  <head>
    <base href="/game/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Laboratorio de Química — SchoolOS</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      
      <!-- Barra de carga brutalista -->
      <div id="unity-loading-bar">
        <div class="loading-title">
          <span>🧪 CARGANDO SIMULADOR...</span>
        </div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      
      <div id="unity-warning"></div>
      
      <!-- Footer brutalista oficial SchoolOS -->
      <div id="unity-footer">
        <div class="footer-left">
          <span class="footer-badge">🧪 LABORATORIO DE QUÍMICA</span>
          <span class="footer-status"><span class="footer-dot"></span> EN LÍNEA</span>
        </div>
        
        <div id="unity-build-title">SchoolOS · Simulación 3D</div>
        
        <button type="button" id="unity-fullscreen-button" title="Pantalla Completa">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
          Pantalla Completa
        </button>
      </div>
    </div>
    
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #FEE2E2; color: #991B1B; border: 1.5px solid #12110E; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: #FEF3C7; color: #92400E; border: 1.5px solid #12110E; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/game.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/game.data",
        frameworkUrl: buildUrl + "/game.framework.js",
        codeUrl: buildUrl + "/game.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "SchoolOS",
        productName: "Laboratorio de Química",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "100%";
        canvas.style.height = "calc(100% - 42px)";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      window.triggerUnityFullscreen = function() {
        if (window.unityInstance) {
          window.unityInstance.SetFullscreen(1);
        } else {
          var btn = document.querySelector("#unity-fullscreen-button");
          if (btn) btn.click();
        }
      };

      window.addEventListener("message", function(event) {
        if (event.data && event.data.type === "UNITY_FULLSCREEN") {
          window.triggerUnityFullscreen();
        } else if (event.data && event.data.type === "UNITY_EXIT_FULLSCREEN") {
          if (window.unityInstance) {
            window.unityInstance.SetFullscreen(0);
          }
        }
      });

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          console.error("Error cargando Unity:", message);
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
